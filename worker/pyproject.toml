[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-alert-hub-worker"
version = "0.1.0"
description = "Periodic board crawler and Telegram notification worker"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "pyyaml>=6,<7",
  "supabase>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "respx>=0.21,<1",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]
browser = [
  "playwright>=1.45,<2",
]

[project.scripts]
site-alert = "site_alert.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=site_alert --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = [
  "*/site_alert/clients/http.py",
  "*/site_alert/clients/telegram.py",
  "*/site_alert/main.py",
  "*/site_alert/repositories/supabase.py",
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
exclude = "tests"
