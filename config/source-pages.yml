# These public list pages were supplied for this deployment. Run a baseline
# once after applying the migration so existing rows are stored without
# Telegram notifications. Check each site's terms and robots.txt before use.
source_pages:
  - id: seongbuk_notice
    site_name: 성북구청
    page_name: 새소식
    category: government
    bot_profile: government
    enabled: true
    list_url: "https://www.sb.go.kr/www/selectBbsNttList.do?bbsNo=41&key=6350"
    base_url: "https://www.sb.go.kr"
    parser: generic_html
    render_js: false
    selectors:
      item: "table tbody tr"
      title: ".p-subject a"
      link: ".p-subject a"
      date: "td:nth-child(4)"
      external_id: "td:nth-child(1)"
    request:
      timeout_seconds: 20
      interval_seconds: 1
      user_agent: "SiteAlertHubBot/1.0 (board-monitor; contact: replace-with-contact@example.com)"
    crawl:
      max_items: 30
      max_retries: 3
    initial_sync:
      mode: baseline

